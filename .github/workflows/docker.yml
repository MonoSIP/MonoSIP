name: Publish Docker image

# All-in-one image (Asterisk + API + web + embedded Postgres + TTS) → ghcr.io/<owner>/monosip
#   main push   → :main, :sha-<short>
#   tag vX.Y.Z  → :X.Y.Z, :X.Y, :latest
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # torch + baked TTS models make the build large; free runner disk first.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/monosip
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=MonoSIP
            org.opencontainers.image.description=Company PBX — Asterisk + admin panel + browser softphone (all-in-one)

      # EMA's normalizer-tr is amd64-only, so the image is published for linux/amd64.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
