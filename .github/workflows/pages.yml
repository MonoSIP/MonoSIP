name: Publish website

# site/ is the Next.js product site. GitHub Pages serves it at
# https://www.monosip.com.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "TASKS.md"
      - "scripts/build-site-docs.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: site/.node-version
          package-manager-cache: false
      - name: Build website
        working-directory: site
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm check:export
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/out

  # Deploy in its own job: an artifact uploaded seconds earlier in the same job
  # is often not listed yet, and deploy-pages fails with
  # "No artifacts named github-pages were found".
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
