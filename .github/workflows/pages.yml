name: Publish website

# site/ is the Next.js product site. This job exports it and copies the result
# to MunaSIP/munasip.github.io (an organization's root Pages site must live in
# that repo). The deploy key (secret SITE_DEPLOY_KEY) can only write there.
# Live: https://munasip.github.io/

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "TASKS.md"
      - "scripts/build-site-docs.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: site/.node-version
      - name: Build website
        working-directory: site
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile
          pnpm build
          pnpm check:export
      - name: Push export to MunaSIP/munasip.github.io
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site_deploy
          chmod 600 ~/.ssh/site_deploy
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site_deploy -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:MunaSIP/munasip.github.io.git publish
          find publish -mindepth 1 -maxdepth 1 ! -name .git ! -name README.md -exec rm -rf {} +
          cp -R site/out/. publish/
          rm -f publish/CNAME
          cd publish
          # The Pages repo keeps its own README.
          git checkout -- README.md
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish site from ${GITHUB_SHA::7}"
          git push origin main
