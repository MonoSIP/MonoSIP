worker_processes auto;
events { worker_connections 1024; }

# TURNS on 443 (AiPBX-style ALPN mux): browsers send ALPN (http/1.1, h2) → HTTPS;
# WebRTC TURNS clients usually send empty ALPN → coturn TLS.
stream {
  # Docker embedded DNS — re-resolve after container recreate
  resolver 127.0.0.11 valid=10s ipv6=off;

  map $ssl_preread_alpn_protocols $munasip_tls_backend {
    default      https_backend;
    ""           turns_backend;
    ~stun\.turn  turns_backend;
  }

  upstream https_backend {
    server 127.0.0.1:8443;
  }

  upstream turns_backend {
    server coturn:5349;
  }

  server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $munasip_tls_backend;
    proxy_connect_timeout 5s;
    proxy_timeout 600s;
  }
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 50m;

  resolver 127.0.0.11 valid=10s ipv6=off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 (API serves the challenge token)
    location ^~ /.well-known/acme-challenge/ {
      set $api_acme http://api:3000;
      proxy_pass $api_acme;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # TLS terminates here (stream demuxed ALPN traffic from :443)
  server {
    listen 127.0.0.1:8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /api/ {
      set $api_upstream http://api:3000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    location /ws {
      set $api_ws http://api:3000/ws;
      proxy_pass $api_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }

    # Softphone SIP over WebSocket (TLS at nginx -> Asterisk HTTP /ws)
    location = /asterisk-ws {
      set $ast_ws http://asterisk:8088/ws;
      proxy_pass $ast_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    location /asterisk-ws/ {
      set $ast_ws http://asterisk:8088/ws;
      proxy_pass $ast_ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }

    # Public website call widget script
    location = /widget.js {
      set $api_widget http://api:3000/widget.js;
      proxy_pass $api_widget;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      add_header Access-Control-Allow-Origin * always;
      add_header Cache-Control "public, max-age=300" always;
    }

    location / {
      set $web_upstream http://web:80;
      proxy_pass $web_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
