[Definition]
; Notify MunaSIP API (via host nginx :443) so the ban appears in Admin → Security.
; fail2ban runs network_mode=host; API is only published through nginx.
actionban = curl -sk -X POST "https://127.0.0.1/api/v1/internal/security/ban" -H "content-type: application/json" -H "x-munasip-internal: <internal_secret>" -d "{\"ip\":\"<ip>\",\"bantime\":<bantime>,\"jail\":\"<name>\",\"reason\":\"fail2ban <name>\"}" || curl -s -X POST "http://127.0.0.1/api/v1/internal/security/ban" -H "content-type: application/json" -H "x-munasip-internal: <internal_secret>" -d "{\"ip\":\"<ip>\",\"bantime\":<bantime>,\"jail\":\"<name>\",\"reason\":\"fail2ban <name>\"}" || true
actionunban =

[Init]
name = default
internal_secret = munasip_internal_change_me
