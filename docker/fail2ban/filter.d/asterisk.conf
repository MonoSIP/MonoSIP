[Definition]
; Asterisk PJSIP / chan_pjsip auth failures
failregex = ^.*(Registration from|Failed to authenticate|Wrong password|No matching endpoint|No matching peer|Failed to authenticate device|Rejection|Forbidden).* <HOST>
            ^.*NOTICE.* <HOST> failed for '.*' - No matching endpoint found
            ^.*SECURITY.* <HOST> .* FailedACL
            ^.*SECURITY.* <HOST> .* InvalidAccountID
            ^.*SECURITY.* <HOST> .* ChallengeResponseFailed
ignoreregex =
