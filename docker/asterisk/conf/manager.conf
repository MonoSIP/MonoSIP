[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
; Trunk monitor / queue polls open a short AMI session each tick — without this
; the console is flooded with "Manager logged on/off" and real SIP noise is lost.
displayconnects = no

[__AMI_USER__]
secret = __AMI_PASS__
deny = 0.0.0.0/0.0.0.0
permit = 172.16.0.0/12
permit = 192.168.0.0/16
permit = 10.0.0.0/8
read = all
write = all
