[general]
dateformat=%F %T
queue_log = no
rotatestrategy = sequential

[logfiles]
; Console
console => notice,warning,error
; Persistent volume mounted for fail2ban
messages => notice,warning,error
; verbose stays off this file so each `asterisk -rx` does not append
; "Remote UNIX connection" / "disconnected". Dialplan steps stay on the foreground console.
full => notice,warning,error,debug
security => security
