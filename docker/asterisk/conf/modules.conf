[modules]
autoload=yes
; Legacy chan_sip — MonoSIP is PJSIP-only.
noload => chan_sip.so
; HEP/Homer — not used.
noload => res_hep.so
noload => res_hep_rtcp.so
noload => res_hep_pjsip.so
; Asterisk CDR/CEL backends — MonoSIP writes CDR via ARI + /internal/cdr.
; Sample configs from the base image make these decline at boot (ERROR noise).
noload => cdr_pgsql.so
noload => cdr_odbc.so
noload => cdr_adaptive_odbc.so
noload => cdr_sqlite3_custom.so
noload => cdr_custom.so
noload => cdr_csv.so
noload => cdr_tds.so
noload => cdr_beanstalkd.so
noload => cdr_manager.so
noload => cel_pgsql.so
noload => cel_odbc.so
noload => cel_sqlite3_custom.so
noload => cel_custom.so
noload => cel_tds.so
noload => cel_beanstalkd.so
noload => cel_manager.so
; ADSI is obsolete; base image still ships the modules (future-removal WARN).
noload => res_adsi.so
noload => app_adsiprog.so
noload => app_getcpeid.so
; Phoneprov expects users.conf; MonoSIP provisions via the admin API instead.
noload => res_phoneprov.so
noload => res_pjsip_phoneprov_provider.so
; Realtime drivers — MonoSIP stores config in Postgres via the API, not Asterisk realtime.
noload => res_config_pgsql.so
noload => res_config_ldap.so
noload => res_config_odbc.so
